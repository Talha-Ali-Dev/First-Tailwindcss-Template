                <!-- Nav List  -->
                <div class="text-heading/90 font-semibold hidden lg:flex justify-center items-center gap-7 text-sm">
                    <a href="" class="flex gap-1 justify-center items-center group" id="product">

                    <a href="" class="flex gap-1 justify-center items-center group" id="developer">

            <div class="hidden lg:flex justify-between gap-2">

                    <span><img src="assets/icons/github.png" alt=""></span>

                    class="px-3 py-0.5 border border-neutral-100/10 text-heading/90 text-sm rounded-lg font-semibold hover:bg-neutral-50/5">Sign

                <!-- Main Btn -->

            <div class="flex justify-center items-center lg:hidden">
